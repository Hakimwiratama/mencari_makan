```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mencari Makan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍽️ Mencari Makan</h1>
        <p>Temukan tempat makan favorit di sekitarmu!</p>
    </header>

    <main>
        <section class="pencarian">
            <h2>Cari Tempat Makan</h2>

            <form id="formPencarian">
                <input
                    type="text"
                    id="kataKunci"
                    placeholder="Cari nasi goreng, sate, rendang..."
                    autocomplete="off"
                >
                <button type="submit">Cari</button>
            </form>
        </section>

        <section class="daftar">
            <h2>Daftar Tempat Makan</h2>
            <div id="hasil">
                <p>Ketik nama makanan untuk mulai mencari.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Mencari Makan</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
